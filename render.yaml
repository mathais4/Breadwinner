# Render Blueprint: New > Blueprint > pick this repo.
# After the first deploy, set CLIENT_ORIGIN (api) and VITE_API_URL (web)
# to each other's URLs, then redeploy both.
databases:
  - name: job-tracker-db
    plan: free

services:
  - type: web
    name: job-tracker-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: job-tracker-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
